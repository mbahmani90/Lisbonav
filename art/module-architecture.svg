<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 960" width="1540" height="960" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Lisbonav — module architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CA8A04"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12.5px; fill: #64748B; }
      .panelTitle { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .name { font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .desc { font-size: 11px; fill: #334155; text-anchor: middle; }
      .chip { font-size: 10.5px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .chipsub { font-size: 9.5px; fill: #475569; text-anchor: middle; }
      .small { font-size: 11px; fill: #475569; }
      .note { font-size: 12px; fill: #1E293B; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 10.5px; fill: #0F172A; }
      .dep { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .impl { stroke: #CA8A04; stroke-width: 1.7; stroke-dasharray: 6 4; fill: none; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1540" height="960" fill="#F8FAFC"/>

  <text x="40" y="34" class="title">Lisbonav — module architecture</text>
  <text x="40" y="56" class="sub">Platform shells → app (navigation + wiring) → independent feature modules → shared modules · arrows = "depends on"</text>

  <!-- ===================== GRAPH ===================== -->

  <!-- Row 1: platform shells -->
  <rect x="150" y="84" width="300" height="66" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="300" y="106" class="name">androidApp</text>
  <text x="300" y="124" class="desc">LisbonavApp · MainActivity (Kotlin)</text>
  <text x="300" y="140" class="desc" fill="#A16207">FirebaseAndroidAnalytics (Firebase SDK)</text>
  <rect x="740" y="84" width="300" height="66" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="890" y="106" class="name">iosApp</text>
  <text x="890" y="124" class="desc">SwiftUI shell · imports "Shared"</text>
  <text x="890" y="140" class="desc" fill="#A16207">FirebaseIosAnalytics (Firebase via SPM)</text>

  <path d="M300 152 L300 188" class="dep"/>
  <path d="M890 152 L890 188" class="dep"/>

  <!-- Row 2: app -->
  <rect x="80" y="190" width="1030" height="82" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="595" y="218" class="name">app</text>
  <text x="595" y="238" class="desc">App.kt · NavHost + floating bottom bar (Map | Card) · consent dialog · screen_view per tab · initKoin(analytics) starts Koin with every module</text>
  <text x="595" y="256" class="desc">builds the iOS "Shared" framework (exports :analytics so Swift can implement it)</text>

  <!-- Row 3: features -->
  <rect x="80" y="326" width="260" height="166" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="210" y="350" class="name">feature:map</text>
  <text x="210" y="368" class="desc">live buses on a map · line search</text>
  <rect x="92" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="130" y="400" class="chip">data</text>
  <text x="130" y="416" class="chipsub">Carris API</text>
  <text x="130" y="430" class="chipsub">DTOs · mapper</text>
  <text x="130" y="444" class="chipsub">repository</text>
  <rect x="174" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="212" y="400" class="chip">domain</text>
  <text x="212" y="416" class="chipsub">Vehicle</text>
  <text x="212" y="430" class="chipsub">GetVehicles</text>
  <text x="212" y="444" class="chipsub">UseCase</text>
  <rect x="256" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="294" y="400" class="chip">presentation</text>
  <text x="294" y="416" class="chipsub">VehicleMap</text>
  <text x="294" y="430" class="chipsub">ViewModel</text>
  <text x="294" y="444" class="chipsub">map screen</text>
  <text x="210" y="481" class="small" fill="#A16207" text-anchor="middle">logs line_search · map_load_error</text>

  <rect x="380" y="326" width="260" height="166" rx="12" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.8"/>
  <text x="510" y="350" class="name">feature:transport-card</text>
  <text x="510" y="368" class="desc">Navegante card: tap → passes, trips</text>
  <rect x="392" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#9333EA"/>
  <text x="430" y="400" class="chip">data</text>
  <text x="430" y="416" class="chipsub">CardReader</text>
  <text x="430" y="430" class="chipsub">(Calypso)</text>
  <text x="430" y="444" class="chipsub">dump → model</text>
  <rect x="474" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#9333EA"/>
  <text x="512" y="400" class="chip">domain</text>
  <text x="512" y="416" class="chipsub">TransportCard</text>
  <text x="512" y="430" class="chipsub">ReadTransport</text>
  <text x="512" y="444" class="chipsub">CardUseCase</text>
  <rect x="556" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#9333EA"/>
  <text x="594" y="400" class="chip">presentation</text>
  <text x="594" y="416" class="chipsub">TransportCard</text>
  <text x="594" y="430" class="chipsub">ViewModel</text>
  <text x="594" y="444" class="chipsub">card screen</text>
  <text x="510" y="481" class="small" fill="#A16207" text-anchor="middle">logs card_read (result only)</text>

  <rect x="676" y="346" width="140" height="110" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="746" y="374" class="name">calypso-nfc</text>
  <text x="746" y="394" class="desc">SDK</text>
  <text x="746" y="410" class="desc">NFC transport · APDUs</text>
  <text x="746" y="426" class="desc">CalypsoReader</text>
  <text x="746" y="442" class="desc">no UI · no app types</text>

  <rect x="850" y="326" width="260" height="166" rx="12" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.8"/>
  <text x="980" y="350" class="name">feature:consent</text>
  <text x="980" y="368" class="desc">analytics opt-in, asked once · DataStore from :core</text>
  <rect x="862" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#E11D48"/>
  <text x="900" y="400" class="chip">data</text>
  <text x="900" y="416" class="chipsub">DataStore</text>
  <text x="900" y="430" class="chipsub">Consent</text>
  <text x="900" y="444" class="chipsub">Repository</text>
  <rect x="944" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#E11D48"/>
  <text x="982" y="400" class="chip">domain</text>
  <text x="982" y="416" class="chipsub">Analytics</text>
  <text x="982" y="430" class="chipsub">Consent</text>
  <text x="982" y="444" class="chipsub">apply rule</text>
  <rect x="1026" y="382" width="76" height="80" rx="8" fill="#FFFFFF" stroke="#E11D48"/>
  <text x="1064" y="400" class="chip">presentation</text>
  <text x="1064" y="416" class="chipsub">Consent</text>
  <text x="1064" y="430" class="chipsub">ViewModel</text>
  <text x="1064" y="444" class="chipsub">dialog</text>
  <text x="980" y="481" class="small" fill="#A16207" text-anchor="middle">turns collection on / off</text>

  <!-- app → features -->
  <path d="M210 274 L210 324" class="dep"/>
  <path d="M510 274 L510 324" class="dep"/>
  <path d="M980 274 L980 324" class="dep"/>
  <!-- card → sdk -->
  <path d="M642 401 L674 401" class="dep"/>

  <!-- forbidden feature ↔ feature -->
  <path d="M342 418 L378 418" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowRed)" marker-start="url(#arrowRed)"/>
  <circle cx="360" cy="418" r="9" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
  <text x="360" y="422.5" font-size="12" font-weight="700" fill="#DC2626" text-anchor="middle">✕</text>
  <text x="360" y="316" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">✕ features never depend on each other</text>

  <!-- Row 4: shared modules -->
  <rect x="80" y="550" width="250" height="84" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
  <text x="205" y="574" class="name">:core</text>
  <text x="205" y="592" class="desc">createHttpClient(engine) · OkHttp / Darwin</text>
  <text x="205" y="607" class="desc">settings DataStore · Koin modules</text>
  <text x="205" y="624" class="desc" fill="#C2410C">non-UI only — no Compose, no routes</text>

  <rect x="380" y="550" width="260" height="84" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/>
  <text x="510" y="574" class="name">:systemdesign</text>
  <text x="510" y="592" class="desc">LisbonavTheme · light + dark</text>
  <text x="510" y="607" class="desc">components once 2+ features share them</text>
  <text x="510" y="624" class="desc" fill="#0F766E">no screens, no ViewModels</text>

  <rect x="770" y="550" width="340" height="84" rx="12" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.8"/>
  <text x="940" y="574" class="name">:analytics</text>
  <text x="940" y="592" class="desc">Analytics interface · AnalyticsEvent · NoOpAnalytics</text>
  <text x="940" y="607" class="desc">used by every feature and app · implemented by the platform apps</text>
  <text x="940" y="624" class="desc" fill="#A16207">no Firebase here: shared code never sees the SDK</text>

  <!-- features → shared modules -->
  <path d="M190 494 L190 548" class="dep"/>
  <path d="M310 494 L420 548" class="dep"/>
  <path d="M510 494 L510 548" class="dep"/>
  <path d="M880 494 L610 548" class="dep"/>
  <path d="M1040 494 L1040 548" class="dep"/>
  <!-- app → core, left rail -->
  <path d="M80 240 H60 V592 H78" class="dep"/>
  <text x="74" y="540" class="small" text-anchor="start" transform="rotate(-90 74 540)">Koin</text>
  <!-- app → systemdesign (theme), outer left rail under the shared row -->
  <path d="M80 258 H44 V652 H510 V636" class="dep"/>
  <text x="56" y="666" class="small">app applies the theme (LisbonavTheme)</text>
  <!-- app → analytics, right rail -->
  <path d="M1110 230 H1130 V575 H1112" class="dep"/>
  <text x="1122" y="520" class="small" transform="rotate(-90 1122 520)">api · export</text>
  <!-- platform apps implement Analytics -->
  <path d="M300 84 V70 H1152 V612 H1114" class="impl" marker-end="url(#arrowGold)"/>
  <path d="M890 84 V70" class="impl"/>
  <text x="1164" y="340" font-size="11" fill="#A16207" transform="rotate(90 1164 340)" text-anchor="middle">both platform apps implement Analytics with Firebase</text>

  <!-- ===================== RULES ===================== -->
  <rect x="40" y="690" width="1110" height="240" rx="12" class="panel"/>
  <text x="56" y="716" class="panelTitle">Rules</text>
  <text x="56" y="742" class="note">• <tspan font-weight="700">app</tspan> is the only module that knows all features: it builds the NavHost, the bottom bar, the consent dialog and the Koin graph.</text>
  <text x="56" y="766" class="note">• <tspan font-weight="700">Each feature owns its route and layers</tspan> (data / domain / presentation, screens, ViewModels); features never depend on each other.</text>
  <text x="56" y="790" class="note">• <tspan font-weight="700">:systemdesign</tspan> = theme + components used by 2+ features; <tspan font-weight="700">:core</tspan> = shared non-UI code (HTTP client, settings DataStore).</text>
  <text x="56" y="814" class="note">• <tspan font-weight="700">:analytics</tspan> is an interface only (Firebase lives in the platform apps); features log their own events from ViewModels.</text>
  <text x="56" y="838" class="note">• <tspan font-weight="700">feature:consent</tspan> asks once on first launch; only "Allow" turns collection on, the answer is kept in the DataStore.</text>

  <line x1="56" y1="874" x2="96" y2="874" class="dep"/>
  <text x="104" y="878" class="small">depends on</text>
  <line x1="190" y1="874" x2="230" y2="874" class="impl" marker-end="url(#arrowGold)"/>
  <text x="238" y="878" class="small">implements</text>
  <line x1="320" y1="874" x2="360" y2="874" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="368" y="878" class="small">forbidden</text>
  <rect x="440" y="864" width="26" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="472" y="878" class="small">app</text>
  <rect x="510" y="864" width="26" height="18" rx="4" fill="#DCFCE7" stroke="#16A34A"/>
  <rect x="540" y="864" width="26" height="18" rx="4" fill="#F3E8FF" stroke="#9333EA"/>
  <rect x="570" y="864" width="26" height="18" rx="4" fill="#FFE4E6" stroke="#E11D48"/>
  <text x="602" y="878" class="small">features</text>
  <rect x="664" y="864" width="26" height="18" rx="4" fill="#FFEDD5" stroke="#EA580C"/>
  <text x="696" y="878" class="small">core</text>
  <rect x="740" y="864" width="26" height="18" rx="4" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="772" y="878" class="small">systemdesign</text>
  <rect x="860" y="864" width="26" height="18" rx="4" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="892" y="878" class="small">analytics</text>
  <rect x="964" y="864" width="26" height="18" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="996" y="878" class="small">SDK</text>
  <text x="56" y="912" class="small">Gold text = events a feature logs through :analytics (outcomes only, no personal data). Later: a build-logic convention plugin for the shared Gradle setup.</text>

  <!-- ===================== NAVIGATION ===================== -->
  <rect x="1190" y="80" width="320" height="400" rx="12" class="panel"/>
  <text x="1206" y="106" class="panelTitle">Navigation</text>

  <!-- phone mock -->
  <rect x="1220" y="124" width="120" height="236" rx="16" fill="#1E293B"/>
  <rect x="1227" y="136" width="106" height="212" rx="8" fill="#E0F2FE"/>
  <rect x="1237" y="146" width="86" height="16" rx="8" fill="#EEEEEE" fill-opacity="0.9"/>
  <circle cx="1260" cy="210" r="7" fill="#FFDD00" stroke="#1C1C1C"/>
  <circle cx="1296" cy="240" r="7" fill="#FFDD00" stroke="#1C1C1C"/>
  <circle cx="1274" cy="272" r="7" fill="#FFDD00" stroke="#1C1C1C"/>
  <rect x="1242" y="314" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="1246" y="317" width="36" height="20" rx="10" fill="#FFDD00"/>
  <text x="1264" y="331" font-size="10" font-weight="700" fill="#1C1C1C" text-anchor="middle">Map</text>
  <text x="1300" y="331" font-size="10" fill="#475569" text-anchor="middle">Card</text>

  <text x="1354" y="140" class="small" font-weight="700">floating bottom bar</text>
  <text x="1354" y="156" class="small">in app: Map | Card</text>
  <text x="1354" y="180" class="small">selected tab comes</text>
  <text x="1354" y="196" class="small">from the back stack</text>
  <text x="1354" y="220" class="small">(no extra screen state)</text>

  <text x="1206" y="384" class="small" font-weight="700">Navigation Compose (KMP), type-safe routes:</text>
  <text x="1206" y="404" class="mono">@Serializable object MapRoute</text>
  <text x="1206" y="420" class="mono">fun NavGraphBuilder.mapScreen()</text>
  <text x="1206" y="440" class="mono">@Serializable object TransportCardRoute</text>
  <text x="1206" y="456" class="mono">fun NavGraphBuilder.transportCardScreen()</text>

  <!-- ===================== ANALYTICS ===================== -->
  <rect x="1190" y="500" width="320" height="430" rx="12" class="panel"/>
  <text x="1206" y="526" class="panelTitle">Analytics (Firebase)</text>

  <text x="1206" y="550" class="small" font-weight="700">Firebase has no KMP SDK, so each app adds it:</text>
  <rect x="1206" y="560" width="288" height="112" rx="8" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="1218" y="580" class="mono">androidApp: FirebaseAndroidAnalytics</text>
  <text x="1218" y="596" class="mono">iosApp:     FirebaseIosAnalytics</text>
  <text x="1218" y="616" class="mono">  ↓ initKoin(analytics)</text>
  <text x="1218" y="632" class="mono">single&lt;Analytics&gt; in Koin</text>
  <text x="1218" y="648" class="mono">consent: setCollectionEnabled()</text>
  <text x="1218" y="664" class="mono">ViewModels: analytics.log(event)</text>

  <text x="1206" y="696" class="small" font-weight="700">Privacy first (GDPR):</text>
  <text x="1206" y="714" class="small">• collection off until the user taps "Allow"</text>
  <text x="1206" y="730" class="small">• no ad personalisation, no advertising ID</text>
  <text x="1206" y="746" class="small">• no personal data in events (card, trips)</text>
  <text x="1206" y="762" class="small">• no Firebase config file → NoOpAnalytics</text>

  <text x="1206" y="790" class="small" font-weight="700">Steps</text>
  <rect x="1206" y="800" width="288" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="1216" y="815" class="small" fill="#14532D">✓ :analytics module + Koin binding</text>
  <rect x="1206" y="826" width="288" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="1216" y="841" class="small" fill="#14532D">✓ Firebase on Android and iOS, collection off</text>
  <rect x="1206" y="852" width="288" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="1216" y="867" class="small" fill="#14532D">✓ consent dialog + stored choice</text>
  <rect x="1206" y="878" width="288" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="1216" y="893" class="small" fill="#14532D">✓ screen views + feature events</text>
</svg>
