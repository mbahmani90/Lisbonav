<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 940" width="1420" height="940" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Lisbonav — module architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CA8A04"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12.5px; fill: #64748B; }
      .panelTitle { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .name { font-size: 15px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .desc { font-size: 11px; fill: #334155; text-anchor: middle; }
      .chip { font-size: 10.5px; font-weight: 700; fill: #334155; text-anchor: middle; }
      .chipsub { font-size: 9.5px; fill: #475569; text-anchor: middle; }
      .small { font-size: 11px; fill: #475569; }
      .note { font-size: 12px; fill: #1E293B; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 10.5px; fill: #0F172A; }
      .dep { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .impl { stroke: #CA8A04; stroke-width: 1.7; stroke-dasharray: 6 4; fill: none; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1420" height="940" fill="#F8FAFC"/>

  <text x="40" y="34" class="title">Lisbonav — module architecture</text>
  <text x="40" y="56" class="sub">Platform shells → app (navigation + wiring) → independent feature modules → shared modules · arrows = "depends on"</text>

  <!-- ===================== GRAPH ===================== -->

  <!-- Row 1: platform shells -->
  <rect x="80" y="84" width="300" height="66" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="230" y="106" class="name">androidApp</text>
  <text x="230" y="124" class="desc">LisbonavApp · MainActivity (Kotlin)</text>
  <text x="230" y="140" class="desc" fill="#A16207">FirebaseAndroidAnalytics (Firebase SDK)</text>
  <rect x="620" y="84" width="300" height="66" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="770" y="106" class="name">iosApp</text>
  <text x="770" y="124" class="desc">SwiftUI shell · imports "Shared"</text>
  <text x="770" y="140" class="desc" fill="#A16207">FirebaseIosAnalytics (Firebase via SPM)</text>

  <path d="M230 152 L230 188" class="dep"/>
  <path d="M770 152 L770 188" class="dep"/>

  <!-- Row 2: app -->
  <rect x="80" y="190" width="900" height="82" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="530" y="218" class="name">app</text>
  <text x="530" y="238" class="desc">App.kt · NavHost + floating bottom bar (Map | Card) · initKoin(analytics) starts Koin with every module</text>
  <text x="530" y="256" class="desc">builds the iOS "Shared" framework (exports :analytics so Swift can implement it)</text>

  <!-- Row 3: features -->
  <rect x="80" y="326" width="320" height="150" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="240" y="350" class="name">feature:map</text>
  <text x="240" y="368" class="desc">live buses on Google Maps / MapKit · line search</text>
  <rect x="92" y="382" width="96" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="140" y="400" class="chip">data</text>
  <text x="140" y="416" class="chipsub">Carris API</text>
  <text x="140" y="430" class="chipsub">DTOs · mapper</text>
  <text x="140" y="444" class="chipsub">repository</text>
  <rect x="194" y="382" width="96" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="242" y="400" class="chip">domain</text>
  <text x="242" y="416" class="chipsub">Vehicle</text>
  <text x="242" y="430" class="chipsub">GetVehicles</text>
  <text x="242" y="444" class="chipsub">UseCase</text>
  <rect x="296" y="382" width="96" height="80" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
  <text x="344" y="400" class="chip">presentation</text>
  <text x="344" y="416" class="chipsub">VehicleMap</text>
  <text x="344" y="430" class="chipsub">ViewModel</text>
  <text x="344" y="444" class="chipsub">map screen</text>

  <rect x="500" y="326" width="280" height="150" rx="12" fill="#F3E8FF" stroke="#9333EA" stroke-width="1.8"/>
  <text x="640" y="350" class="name">feature:transport-card</text>
  <text x="640" y="368" class="desc">Navegante card: tap → passes, trips</text>
  <rect x="512" y="382" width="82" height="80" rx="8" fill="#FFFFFF" stroke="#9333EA"/>
  <text x="553" y="400" class="chip">data</text>
  <text x="553" y="416" class="chipsub">CardReader</text>
  <text x="553" y="430" class="chipsub">(Calypso)</text>
  <text x="553" y="444" class="chipsub">dump → model</text>
  <rect x="599" y="382" width="82" height="80" rx="8" fill="#FFFFFF" stroke="#9333EA"/>
  <text x="640" y="400" class="chip">domain</text>
  <text x="640" y="416" class="chipsub">TransportCard</text>
  <text x="640" y="430" class="chipsub">ReadTransport</text>
  <text x="640" y="444" class="chipsub">CardUseCase</text>
  <rect x="686" y="382" width="82" height="80" rx="8" fill="#FFFFFF" stroke="#9333EA"/>
  <text x="727" y="400" class="chip">presentation</text>
  <text x="727" y="416" class="chipsub">TransportCard</text>
  <text x="727" y="430" class="chipsub">ViewModel</text>
  <text x="727" y="444" class="chipsub">card screen</text>

  <rect x="820" y="346" width="160" height="110" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="900" y="374" class="name">calypso-nfc</text>
  <text x="900" y="394" class="desc">SDK</text>
  <text x="900" y="410" class="desc">NFC transport · APDUs</text>
  <text x="900" y="426" class="desc">CalypsoReader</text>
  <text x="900" y="442" class="desc">no UI · no app types</text>

  <!-- app → features -->
  <path d="M240 274 L240 324" class="dep"/>
  <path d="M640 274 L640 324" class="dep"/>
  <!-- card → sdk -->
  <path d="M782 401 L818 401" class="dep"/>

  <!-- forbidden feature ↔ feature -->
  <path d="M402 410 L498 410" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowRed)" marker-start="url(#arrowRed)"/>
  <circle cx="450" cy="410" r="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/>
  <text x="450" y="415" font-size="13" font-weight="700" fill="#DC2626" text-anchor="middle">✕</text>
  <text x="450" y="316" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">✕ features never depend on each other</text>

  <!-- Row 4: shared modules -->
  <rect x="80" y="550" width="260" height="84" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
  <text x="210" y="574" class="name">:core</text>
  <text x="210" y="592" class="desc">createHttpClient(engine) · OkHttp / Darwin</text>
  <text x="210" y="607" class="desc">Koin network module</text>
  <text x="210" y="624" class="desc" fill="#C2410C">non-UI only — no Compose, no routes</text>

  <rect x="370" y="550" width="240" height="84" rx="12" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.8"/>
  <text x="490" y="574" class="name">:systemdesign</text>
  <text x="490" y="592" class="desc">LisbonavTheme · light + dark</text>
  <text x="490" y="607" class="desc">components once 2+ features share them</text>
  <text x="490" y="624" class="desc" fill="#0F766E">no screens, no ViewModels</text>

  <rect x="640" y="550" width="340" height="84" rx="12" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.8"/>
  <text x="810" y="574" class="name">:analytics</text>
  <text x="810" y="592" class="desc">Analytics interface · AnalyticsEvent · NoOpAnalytics</text>
  <text x="810" y="607" class="desc">no dependencies · implemented by the platform apps</text>
  <text x="810" y="624" class="desc" fill="#A16207">no Firebase here: shared code never sees the SDK</text>

  <!-- features → core / systemdesign -->
  <path d="M210 478 L210 548" class="dep"/>
  <path d="M360 478 L450 548" class="dep"/>
  <path d="M570 478 L530 548" class="dep"/>
  <!-- app → core, left rail -->
  <path d="M80 240 H60 V592 H78" class="dep"/>
  <text x="74" y="540" class="small" text-anchor="start" transform="rotate(-90 74 540)">Koin</text>
  <!-- app → systemdesign (theme), outer left rail under the shared row -->
  <path d="M80 258 H44 V652 H490 V636" class="dep"/>
  <text x="56" y="666" class="small">app applies the theme (LisbonavTheme)</text>
  <!-- app → analytics, right rail -->
  <path d="M980 230 H1000 V575 H982" class="dep"/>
  <text x="992" y="500" class="small" transform="rotate(-90 992 500)">api · export</text>
  <!-- platform apps implement Analytics -->
  <path d="M230 84 V70 H1022 V612 H984" class="impl" marker-end="url(#arrowGold)"/>
  <path d="M770 84 V70" class="impl"/>
  <text x="1034" y="340" font-size="11" fill="#A16207" transform="rotate(90 1034 340)" text-anchor="middle">both platform apps implement Analytics with Firebase</text>

  <!-- ===================== RULES ===================== -->
  <rect x="40" y="690" width="980" height="220" rx="12" class="panel"/>
  <text x="56" y="716" class="panelTitle">Rules</text>
  <text x="56" y="742" class="note">• <tspan font-weight="700">app</tspan> is the only module that knows all features: it builds the NavHost, the bottom bar and the Koin graph.</text>
  <text x="56" y="766" class="note">• <tspan font-weight="700">Each feature owns its route and layers</tspan> (data / domain / presentation, screens, ViewModels); features never depend on each other.</text>
  <text x="56" y="790" class="note">• <tspan font-weight="700">:systemdesign</tspan> = theme + components used by 2+ features; <tspan font-weight="700">:core</tspan> = shared non-UI code; independent of each other.</text>
  <text x="56" y="814" class="note">• <tspan font-weight="700">:analytics</tspan> is an interface only: Firebase lives in androidApp (Kotlin) and iosApp (Swift), passed in through initKoin.</text>

  <line x1="56" y1="852" x2="96" y2="852" class="dep"/>
  <text x="104" y="856" class="small">depends on</text>
  <line x1="190" y1="852" x2="230" y2="852" class="impl" marker-end="url(#arrowGold)"/>
  <text x="238" y="856" class="small">implements</text>
  <line x1="320" y1="852" x2="360" y2="852" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="368" y="856" class="small">forbidden</text>
  <rect x="440" y="842" width="26" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="472" y="856" class="small">app</text>
  <rect x="510" y="842" width="26" height="18" rx="4" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="542" y="856" class="small">feature</text>
  <rect x="600" y="842" width="26" height="18" rx="4" fill="#CCFBF1" stroke="#0D9488"/>
  <text x="632" y="856" class="small">systemdesign</text>
  <rect x="716" y="842" width="26" height="18" rx="4" fill="#FFEDD5" stroke="#EA580C"/>
  <text x="748" y="856" class="small">core</text>
  <rect x="790" y="842" width="26" height="18" rx="4" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="822" y="856" class="small">analytics</text>
  <rect x="890" y="842" width="26" height="18" rx="4" fill="#EDE9FE" stroke="#7C3AED"/>
  <text x="922" y="856" class="small">SDK</text>
  <text x="56" y="892" class="small">Next: features log their own events through :analytics. Later, with more similar KMP modules: a build-logic convention plugin for the shared Gradle setup.</text>

  <!-- ===================== NAVIGATION ===================== -->
  <rect x="1060" y="80" width="320" height="400" rx="12" class="panel"/>
  <text x="1076" y="106" class="panelTitle">Navigation</text>

  <!-- phone mock -->
  <rect x="1090" y="124" width="120" height="236" rx="16" fill="#1E293B"/>
  <rect x="1097" y="136" width="106" height="212" rx="8" fill="#E0F2FE"/>
  <rect x="1107" y="146" width="86" height="16" rx="8" fill="#EEEEEE" fill-opacity="0.9"/>
  <circle cx="1130" cy="210" r="7" fill="#FFDD00" stroke="#1C1C1C"/>
  <circle cx="1166" cy="240" r="7" fill="#FFDD00" stroke="#1C1C1C"/>
  <circle cx="1144" cy="272" r="7" fill="#FFDD00" stroke="#1C1C1C"/>
  <rect x="1112" y="314" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="1116" y="317" width="36" height="20" rx="10" fill="#FFDD00"/>
  <text x="1134" y="331" font-size="10" font-weight="700" fill="#1C1C1C" text-anchor="middle">Map</text>
  <text x="1170" y="331" font-size="10" fill="#475569" text-anchor="middle">Card</text>

  <text x="1224" y="140" class="small" font-weight="700">floating bottom bar</text>
  <text x="1224" y="156" class="small">in app: Map | Card</text>
  <text x="1224" y="180" class="small">selected tab comes</text>
  <text x="1224" y="196" class="small">from the back stack</text>
  <text x="1224" y="220" class="small">(no extra screen state)</text>

  <text x="1076" y="384" class="small" font-weight="700">Navigation Compose (KMP), type-safe routes:</text>
  <text x="1076" y="404" class="mono">@Serializable object MapRoute</text>
  <text x="1076" y="420" class="mono">fun NavGraphBuilder.mapScreen()</text>
  <text x="1076" y="440" class="mono">@Serializable object TransportCardRoute</text>
  <text x="1076" y="456" class="mono">fun NavGraphBuilder.transportCardScreen()</text>

  <!-- ===================== ANALYTICS ===================== -->
  <rect x="1060" y="500" width="320" height="410" rx="12" class="panel"/>
  <text x="1076" y="526" class="panelTitle">Analytics (Firebase)</text>

  <text x="1076" y="550" class="small" font-weight="700">Firebase has no KMP SDK, so each app adds it:</text>
  <rect x="1076" y="560" width="288" height="96" rx="8" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="1088" y="580" class="mono">androidApp: FirebaseAndroidAnalytics</text>
  <text x="1088" y="596" class="mono">iosApp:     FirebaseIosAnalytics</text>
  <text x="1088" y="616" class="mono">  ↓ initKoin(analytics)</text>
  <text x="1088" y="632" class="mono">single&lt;Analytics&gt; in Koin</text>
  <text x="1088" y="648" class="mono">ViewModels: analytics.log(event)</text>

  <text x="1076" y="680" class="small" font-weight="700">Privacy first (GDPR):</text>
  <text x="1076" y="698" class="small">• collection off until the user opts in</text>
  <text x="1076" y="714" class="small">• no ad personalisation, no advertising ID</text>
  <text x="1076" y="730" class="small">• no personal data in events (card, trips)</text>
  <text x="1076" y="746" class="small">• no Firebase config file → NoOpAnalytics</text>

  <text x="1076" y="774" class="small" font-weight="700">Steps</text>
  <rect x="1076" y="784" width="288" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="1086" y="799" class="small" fill="#14532D">✓ :analytics module + Koin binding</text>
  <rect x="1076" y="810" width="288" height="22" rx="6" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="1086" y="825" class="small" fill="#14532D">✓ Firebase on Android and iOS, collection off</text>
  <rect x="1076" y="836" width="288" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1086" y="851" class="small">○ consent prompt + stored choice</text>
  <rect x="1076" y="862" width="288" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1086" y="877" class="small">○ screen views + feature events</text>
</svg>
