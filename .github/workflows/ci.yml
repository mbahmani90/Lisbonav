name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no permissions by default; each job asks for what it needs (reading the code,
# and the PR's file list for "Changes"). No secrets are used except SONAR_TOKEN: the debug build
# works without google-services.json and the Maps key (the map tiles are just grey).
permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1: pushes are compared with git
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # "matches at least one pattern and none of the ! patterns"
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!art/**'
            workflow:
              - '.github/workflows/**'

  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu # gradle-daemon-jvm.properties asks for Azul 21: no toolchain download
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0: caching + wrapper validation
      - run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Every module's commonTest + androidHostTest on the JVM.
      - run: ./gradlew testAndroidHostTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  lint:
    name: Android Lint
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The KMP library modules have no Android Lint task (AGP 9.1); this checks the app module.
      - run: ./gradlew :androidApp:lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.*
          retention-days: 7

  code-style:
    name: Code style
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew spotlessCheck

  sonar:
    name: SonarQube
    needs: build
    # PRs from forks don't get secrets: no SONAR_TOKEN, so the job is skipped there.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: Sonar uses git blame to tell new code from old
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Runs the JVM tests again for coverage (Kover), then uploads the analysis to SonarQube Cloud.
      - run: ./gradlew koverXmlReport sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ios:
    name: iOS
    needs: changes
    # macOS runners are slow: on main only, and on PRs that change this workflow (so a broken
    # iOS job shows up before it is merged).
    if: ${{ needs.changes.outputs.code == 'true' && (github.event_name == 'push' || needs.changes.outputs.workflow == 'true') }}
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      # Every module's commonTest + iosTest on the simulator. The Swift app itself (3 small files)
      # isn't built here: xcodebuild with Firebase from SPM took over 30 minutes on a cold runner.
      - run: ./gradlew iosSimulatorArm64Test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ios-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  ci-result:
    name: CI result
    needs: [changes, build, unit-tests, lint, code-style, sonar, ios]
    if: ${{ always() }} # also when something failed or was skipped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One required check for branch protection: passes when every job succeeded or was
      # skipped (docs-only changes, iOS on PRs, Sonar on fork PRs), fails on failure or cancellation.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then exit 1; fi
          done
