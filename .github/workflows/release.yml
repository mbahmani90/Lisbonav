name: Release

# Push a version tag → signed APK + AAB → GitHub Release (APK + checksums). The AAB is kept as an
# artifact for Google Play. "Run workflow" (manual) is a dry run: it builds and verifies with the
# real secrets but publishes nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never stop a release half-way

permissions:
  contents: read # default for every job; only "Publish" can write

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu # gradle-daemon-jvm.properties asks for Azul 21
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # v1.2.3 → 1.2.3 / 10203 (major·10000 + minor·100 + patch: always grows, as Play requires).
      - name: Version from tag
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "Dry run: version 0.0.0 / 1"
            echo "name=0.0.0" >> "$GITHUB_OUTPUT"; echo "code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
          (( BASH_REMATCH[2] < 100 && BASH_REMATCH[3] < 100 )) || { echo "::error::Minor and patch must be < 100"; exit 1; }
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "Version $VERSION / $CODE"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"; echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # gh secret set stores whatever it gets, also nothing: fail here with a clear message instead
      # of building an unsigned app or one without map / analytics.
      - name: Check secrets
        env:
          LISBONAV_KEYSTORE_BASE64: ${{ secrets.LISBONAV_KEYSTORE_BASE64 }}
          LISBONAV_KEYSTORE_PASSWORD: ${{ secrets.LISBONAV_KEYSTORE_PASSWORD }}
          LISBONAV_KEY_PASSWORD: ${{ secrets.LISBONAV_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          missing=0
          for name in LISBONAV_KEYSTORE_BASE64 LISBONAV_KEYSTORE_PASSWORD LISBONAV_KEY_PASSWORD MAPS_API_KEY GOOGLE_SERVICES_JSON_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing or empty"; missing=1; fi
          done
          exit $missing

      - name: Decode keystore and Firebase config
        env:
          LISBONAV_KEYSTORE_BASE64: ${{ secrets.LISBONAV_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$LISBONAV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > androidApp/google-services.json
          echo "LISBONAV_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          LISBONAV_KEYSTORE_PASSWORD: ${{ secrets.LISBONAV_KEYSTORE_PASSWORD }}
          LISBONAV_KEY_PASSWORD: ${{ secrets.LISBONAV_KEY_PASSWORD }}
          LISBONAV_KEY_ALIAS: lisbonav # not a secret: GitHub would mask the word everywhere in the logs
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: >
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease
          -Plisbonav.versionName=${{ steps.version.outputs.name }}
          -Plisbonav.versionCode=${{ steps.version.outputs.code }}

      # Decide on exit codes, not on output text (apksigner's wording changes between versions).
      - name: Verify signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          APK=androidApp/build/outputs/apk/release/androidApp-release.apk
          AAB=androidApp/build/outputs/bundle/release/androidApp-release.aab
          "$APKSIGNER" verify "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256 digest)" || true # log only
          # jarsigner exits 0 for unsigned files too: check that the bundle verifies as signed.
          jarsigner -verify "$AAB" | grep -q "^jar verified\." || { echo "::error::AAB is not signed"; exit 1; }

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist bundle
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/lisbonav-$VERSION.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "bundle/lisbonav-$VERSION.aab"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7
      # For Google Play (doc 38): uploaded by hand for now, by a "play" job later.
      - uses: actions/upload-artifact@v7
        with:
          name: play-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore and Firebase config
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.jks" androidApp/google-services.json

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'push' }} # not on a dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job can create the release; it never sees the signing secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout needed
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Lisbonav $VERSION" --generate-notes --verify-tag
